[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./script/deploy" },
    { access = "read-write", path = "./test" }
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
solc ="0.8.34"
# Standalone profile for verifying canonical Uniswap V3 pool bytecode (solc 0.7.6)
[profile.v3pool]
src = "lib/v3-core/contracts"
libs = ["lib"]
solc = "0.7.6"
optimizer = true
optimizer_runs = 800
via_ir = false
evm_version = "istanbul"

# Верификация на Monad mainnet. Ключ Etherscan V2 работает для chainId 143.
[etherscan]
monad = { key = "${ETHERSCAN_API_KEY}", chain = 143, url = "https://api.etherscan.io/v2/api?chainid=143" }
